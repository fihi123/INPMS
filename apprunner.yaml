version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip install -r server/requirements.txt
run:
  # FastAPI 앱이 정적 프론트엔드(index.html)와 REST API(/api/*)를 함께 서빙.
  # DATABASE_URL 미설정 시에도 부팅 → 정적 페이지 동작, /api/* 만 503 (선배포 가능).
  command: uvicorn server.main:app --host 0.0.0.0 --port 8080
  network:
    port: 8080
  # ---- DB 연결 (I&S 에게 RDS Postgres 신청 → Secrets Manager ARN 수령 후 주석 해제) ----
  # secrets:
  #   - name: DATABASE_URL
  #     value-from: "arn:aws:secretsmanager:ap-northeast-2:<account>:secret:inpms-db-xxxxxx"
